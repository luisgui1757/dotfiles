# tmux config — Rose Pine, vi-mode, true-color, Ghostty/WT-friendly.

# ---- Terminal capabilities ---------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-ghostty:RGB"
set -ga terminal-overrides ",alacritty:RGB"
set -ga terminal-overrides ",*256col*:RGB"

# Focus events so nvim's :autoread/gitsigns react when you tab back.
set -g focus-events on

# ---- Behavior ----------------------------------------------------------------
# Mouse controls panes and copy mode; Neovim keeps its own mouse off.
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g status-keys vi
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "tmux:#S #W"
set -g allow-rename off
set -g aggressive-resize on

# ---- Prefix: C-b (default; macOS eats C-Space for input-source switching) ----
set -g prefix C-b
bind C-b send-prefix

# ---- Pane management ---------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H if -F "#{==:#{window_index},#{window_base_index}}" "display-message 'no window left'" "swap-window -t -1"
bind L if -F "#{==:#{window_index},#{session_windows}}" "display-message 'no window right'" "swap-window -t +1"
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ---- Copy-mode (vi-style, with real system-clipboard plumbing) ---------------
# OSC52 broadcasts copies via the terminal — works across SSH and into the
# host clipboard from Ghostty/Windows Terminal without any helper installed.
set -g set-clipboard on

bind -T copy-mode-vi v send -X begin-selection

bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- Status bar and platform integration ----------------------------------
set -g status-position top

# Extended keys: send Ctrl+J distinct from Enter, Ctrl+I distinct from Tab,
# etc. (tmux 3.2+). The *:extkeys terminal-feature flag tells tmux every outer
# terminal can carry the sequence. We deliberately do NOT set
# `extended-keys-format csi-u`: that option only exists on tmux 3.5+ (where
# csi-u is already the default), and older real tmux -- e.g. Ubuntu 24.04's 3.4
# -- aborts that line with `invalid option: extended-keys-format`.
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# Evaluate lower-priority transports first; each available session-native
# helper replaces the binding. Installed display helpers alone are insufficient.
if-shell 'command -v win32yank.exe >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"'
if-shell '[ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i -b"'
if-shell '[ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"'
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# ---- Managed session plugins ----------------------------------------------
# Session save/restore, configured canonically. resurrect restores the nvim
# session file; continuum auto-saves every 15 min and auto-restores on start.
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ---- Rose Pine status bar (Omer-shaped, repo-owned generated config) ---------
# The installer publishes the bar generated by tmux/rose-pine.ps1 as
# ~/.tmux.rose-pine.{main,moon,dawn}.conf. Load the theme before the managed
# plugin attachment so continuum adds its save trigger to the themed status. Switch flavor live with:
#   tmux set -g @rosepine-variant moon; tmux source-file ~/.tmux.conf
# Use `set -go` (only-if-unset) so a live `set -g @rosepine-variant moon` is not
# clobbered back to main every time this overlay is re-sourced.
set -go @rosepine-variant 'main'
%if "#{==:#{@rosepine-variant},moon}"
source-file ~/.tmux.rose-pine.moon.conf
%elif "#{==:#{@rosepine-variant},dawn}"
source-file ~/.tmux.rose-pine.dawn.conf
%else
source-file ~/.tmux.rose-pine.main.conf
%endif

# Only the installer-published attachment activates pinned plugins.
source-file -q ~/.tmux.plugins.conf
