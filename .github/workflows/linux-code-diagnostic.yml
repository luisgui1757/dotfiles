name: Linux Code v5 native diagnostics

on:
  push:
    branches: [diagnostics/installer-linux-code-v5]

permissions:
  contents: read

jobs:
  linux-code-diagnostic:
    name: Linux Code diagnostic (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: linux/amd64
          - runner: ubuntu-26.04-arm
            target: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: installer
        shell: bash
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: installer/go.sum
      - name: Verify actual native runner target
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = '${{ matrix.target }}'
      - name: Prepare disposable Linux display and native font inspection
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth dbus-x11 x11-utils libglib2.0-bin fontconfig pango1.0-tools apt-utils
      - name: Establish trusted disposable system parent
        run: |
          test ! -L /usr/share
          test "$(stat -c %u /usr/share)" = 0
          stat -c 'Code test host before: %n owner=%u mode=%a' /usr/share
          sudo chmod 0755 /usr/share
          test "$(stat -c %u:%a /usr/share)" = 0:755
          stat -c 'Code test host after: %n owner=%u mode=%a' /usr/share
      - name: Verify pinned Code native ownership and repository preservation
        env:
          DOTFILES_TEST_NATIVE_PACKAGES: '1'
          DOTFILES_TEST_NATIVE_CODE: '1'
        run: go test -v -count=1 -timeout 15m -run '^TestNativeLinuxCodeDEBLifecycle$' .
