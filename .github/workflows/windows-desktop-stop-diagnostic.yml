name: Windows desktop cleanup proof

on:
  push:
    branches: [diagnostics/windows-desktop-stop-v10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 100
    defaults:
      run:
        working-directory: installer
        shell: bash
    env:
      GOTOOLCHAIN: local
      DOTFILES_NATIVE_DESKTOP_FONTS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Verify actual disposable native target
        run: |
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = windows/amd64
          test "$GITHUB_ACTIONS/$RUNNER_ENVIRONMENT" = true/github-hosted
      - name: Prove post-exit denial, live denial, private identity and fresh witness
        run: go test -v -count=1 -timeout 3m -run '^TestDesktop(WindowsStopRequiresExactCompletionAndPrivateImage|VSCodeWitnessRequiresFreshLaunchEvidence)$' .
      - name: Verify full public desktop use, update and final restoration
        env:
          DOTFILES_NATIVE_DESKTOP: 1
        run: go test -v -count=1 -timeout 70m -run '^TestNativeDesktopInstalledApplicationLifecycle$' .
