name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_BINSTALL_COMMIT: 81df5c23b0dc775b009efdfc9895c5965b7a4e40
  CARGO_BINSTALL_INSTALLER_SHA256: d3a93702160e0ec03e2a4e996855db1f01adee801fb84a43add24e0877ef8eae
  NVIM_LINUX_VERSION: v0.12.6
  NVIM_LINUX_X86_64_SHA256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  STARSHIP_VERSION: v1.27.0
  STARSHIP_LINUX_X86_64_SHA256: 3b94758850901717eb36aa1b53f8492c1322506ec6d41273bc6151e79ed8e4a1
  TREE_SITTER_CLI_LINUX_VERSION: v0.27.1
  TREE_SITTER_CLI_LINUX_X86_64_SHA256: c7e686aec16ba17053c2e6fd87600ccb10cf8ba3d055756b17e756d538e11114

jobs:
  ubuntu:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: installer/go.sum
      - name: Install deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          # clangd is a test runtime dependency: clangd_projects_spec.lua starts
          # two real clients and deliberately refuses static/mock proof.
          sudo apt-get install -y ca-certificates clangd curl ruby shellcheck tmux zsh python3-pip unzip
          curl -fsSL "https://github.com/starship/starship/releases/download/${STARSHIP_VERSION}/starship-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/starship.tar.gz
          printf '%s  %s\n' "$STARSHIP_LINUX_X86_64_SHA256" /tmp/starship.tar.gz | sha256sum -c -
          sudo tar -xzf /tmp/starship.tar.gz -C /usr/local/bin starship
          starship --version
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_CLI_LINUX_VERSION}/tree-sitter-cli-linux-x64.zip" -o /tmp/tree-sitter-cli-linux-x64.zip
          printf '%s  %s\n' "$TREE_SITTER_CLI_LINUX_X86_64_SHA256" /tmp/tree-sitter-cli-linux-x64.zip | sha256sum -c -
          rm -rf /tmp/tree-sitter-cli
          mkdir -p /tmp/tree-sitter-cli
          unzip -oq /tmp/tree-sitter-cli-linux-x64.zip -d /tmp/tree-sitter-cli
          sudo install -m 0755 /tmp/tree-sitter-cli/tree-sitter /usr/local/bin/tree-sitter
          tree-sitter --version
          curl -fsSL "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${CARGO_BINSTALL_COMMIT}/install-from-binstall-release.sh" -o /tmp/cargo-binstall.sh
          printf '%s  %s\n' "$CARGO_BINSTALL_INSTALLER_SHA256" /tmp/cargo-binstall.sh | sha256sum -c -
          bash /tmp/cargo-binstall.sh
          # taplo-cli 0.10.0 has no cargo-binstall prebuilt (quickinstall 404) and
          # fails to source-build on the current runner Rust (time-crate E0119), so
          # pin 0.9.3, which has a quickinstall prebuilt and installs without compiling.
          "$HOME/.cargo/bin/cargo-binstall" -y taplo-cli@0.9.3 hyperfine
          python3 -m pip install --user --break-system-packages --disable-pip-version-check yamllint editorconfig-checker
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          # Ubuntu 26.04 images ship PowerShell; Microsoft's matching apt repo
          # does not publish it. Require the image runtime so parse tests run.
          command -v pwsh
          pwsh -NoLogo -NoProfile -Command 'if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7 is required" }; $PSVersionTable.PSVersion'

          # Neovim pinned release tarball avoids AppImage/FUSE and old asset-name drift.
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_LINUX_VERSION}/nvim-linux-x86_64.tar.gz" -o /tmp/nvim-linux-x86_64.tar.gz
          printf '%s  %s\n' "$NVIM_LINUX_X86_64_SHA256" /tmp/nvim-linux-x86_64.tar.gz | sha256sum -c -
          sudo rm -rf /opt/nvim-linux-x86_64
          sudo tar -xzf /tmp/nvim-linux-x86_64.tar.gz -C /opt
          sudo ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim
          nvim --version | head -n 1
      - name: Static lint
        run: |
          set -euo pipefail
          make test-static
          make test-bootstrap
      - name: Renovate schema
        run: |
          set -euo pipefail
          make validate-renovate
      - name: shellcheck
        run: |
          set -euo pipefail
          make lint
      - name: Establish trusted disposable completion directories
        run: |
          bash tests/native/linux_host_preparation_test.sh
          bash scripts/prepare-disposable-linux-host.sh shell
      - name: Shell smoke
        run: |
          set -euo pipefail
          make test-shell
      - name: Starship render + perf
        run: |
          set -euo pipefail
          make test-starship
      - name: Tmux load
        run: |
          set -euo pipefail
          make test-tmux
      - name: Nvim plenary busted
        run: |
          set -euo pipefail
          make test-nvim
      - name: AeroSpace static checks
        run: |
          set -euo pipefail
          make test-aerospace

  macos:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-path: installer/go.sum
      - name: Install deps
        run: |
          set -euxo pipefail
          brew install ruby shellcheck neovim tmux starship tree-sitter-cli taplo hyperfine yamllint editorconfig-checker
          echo "$(brew --prefix ruby)/bin" >> "$GITHUB_PATH"
      - name: Make test (full matrix)
        run: |
          set -euo pipefail
          make test
          make test-bootstrap

  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache-dependency-path: installer/go.sum
      - name: Install deps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $WarningPreference = 'Stop'
          if (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          function Install-ModuleWithRetry {
            param(
              [Parameter(Mandatory)][string]$Name,
              [string]$MinimumVersion = ''
            )
            $installArgs = @{
              Name = $Name
              Force = $true
              Scope = 'CurrentUser'
              SkipPublisherCheck = $true
              ErrorAction = 'Stop'
            }
            if (-not [string]::IsNullOrWhiteSpace($MinimumVersion)) {
              $installArgs.MinimumVersion = $MinimumVersion
            }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Install-Module @installArgs
                return
              } catch {
                if ($attempt -eq 3) { throw }
                Write-Host ("WARN: Install-Module {0} failed on attempt {1}/3: {2}" -f $Name, $attempt, $_.Exception.Message)
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
          $pester = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version -ge [version]'5.0.0' } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester) {
            Install-ModuleWithRetry -Name Pester -MinimumVersion 5.5.0
          }
          Install-ModuleWithRetry -Name PSScriptAnalyzer
          $nvimPin = (Get-Content -LiteralPath 'installer/archive-pins.json' -Raw | ConvertFrom-Json).resources.'tool.nvim'.'windows/amd64'
          $nvimUrl = "https://github.com/neovim/neovim/releases/download/v$($nvimPin.version)/nvim-win64.zip"
          if ($nvimPin.format -cne 'zip' -or $nvimPin.strip_components -ne 1 -or
              $nvimPin.sha256 -cnotmatch '^[0-9a-f]{64}$' -or $nvimPin.url -cne $nvimUrl) {
            throw 'Unexpected reviewed Windows Neovim archive pin.'
          }
          $nvimRoot = Join-Path $env:RUNNER_TEMP ("quality-neovim-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $nvimRoot | Out-Null
          $nvimArchive = Join-Path $nvimRoot 'nvim-win64.zip'
          $nvimPayload = Join-Path $nvimRoot 'payload'
          Invoke-WebRequest -UseBasicParsing -Uri $nvimPin.url -OutFile $nvimArchive
          $nvimHash = (Get-FileHash -LiteralPath $nvimArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($nvimHash -cne $nvimPin.sha256) {
            throw 'Neovim archive checksum mismatch; nothing was extracted or executed.'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nvimArchive, $nvimPayload)
          $nvimEntries = @(Get-ChildItem -LiteralPath $nvimPayload -Force)
          if ($nvimEntries.Count -ne 1 -or -not $nvimEntries[0].PSIsContainer -or $nvimEntries[0].Name -cne 'nvim-win64') {
            throw 'Unexpected verified Neovim archive layout.'
          }
          $nvimBin = Join-Path $nvimPayload 'nvim-win64/bin'
          $nvimExe = Join-Path $nvimBin 'nvim.exe'
          $nvimRuntime = Join-Path $nvimPayload 'nvim-win64/share/nvim/runtime/filetype.lua'
          if (-not (Test-Path -LiteralPath $nvimExe -PathType Leaf) -or
              -not (Test-Path -LiteralPath $nvimRuntime -PathType Leaf)) {
            throw 'Verified Neovim archive is missing its executable or runtime.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nvimBin
          $env:PATH = "$nvimBin;$env:PATH"
          if ([System.IO.Path]::GetFullPath((Get-Command nvim -CommandType Application).Source) -ne [System.IO.Path]::GetFullPath($nvimExe)) {
            throw 'Windows quality resolved a different Neovim executable.'
          }
          $nvimVersion = @(& $nvimExe --version)
          if ($nvimVersion.Count -eq 0 -or $nvimVersion[0] -cne "NVIM v$($nvimPin.version)") {
            throw 'Verified Neovim version differs from its reviewed pin.'
          }
          Write-Host "Verified $($nvimPin.url) SHA256=$nvimHash"
          Write-Host "Neovim executable: $nvimExe"
          Write-Host $nvimVersion[0]

          Import-Module Pester -MinimumVersion 5.0.0 -Force
          Import-Module PSScriptAnalyzer -Force
          Get-Module Pester, PSScriptAnalyzer | Format-Table Name,Version,Path -AutoSize
      - name: Windows test suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          .\test.ps1
