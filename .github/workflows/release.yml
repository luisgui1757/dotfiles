name: release

# A merge that changes the version in release/manifest.json publishes that
# version. scripts/release.py checks the merged pull request, scans the release
# range, tags the merge commit, runs the native installer matrix on the tag and
# publishes the immutable release with its proof asset. A version that is
# already published changes nothing. Re-run a failed run: it keeps the tag, an
# exact-tag run that passed or still runs, and the draft.

on:
  push:
    branches: [main]
    paths:
      - release/manifest.json

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GITLEAKS_VERSION: v8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  publish:
    name: Publish the release
    runs-on: ubuntu-26.04
    # The exact-tag native run takes about 30 minutes after it leaves the queue.
    timeout-minutes: 180
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Publish the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/release.py publish --commit "$GITHUB_SHA"
