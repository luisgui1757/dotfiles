name: Windows Build Tools accounting diagnostic

on:
  push:
    branches: [diagnostics/windows-buildtools-accounting-v9]

permissions:
  contents: read

concurrency:
  group: windows-buildtools-accounting-v9
  cancel-in-progress: false

jobs:
  query:
    name: Private query lifetime and compiler reuse
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      DOTFILES_NATIVE_WINDOWS_VENDOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false
      - name: Verify disposable native target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Disposable hosted runner required' }
          if ((go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne 'amd64') { throw 'Native Windows amd64 required' }
      - name: Prove the missing-accounting regression fails
        working-directory: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Get-Location) 'windows_buildtools_query_windows.go'
          $saved = [IO.File]::ReadAllBytes($path)
          $source = [Text.Encoding]::UTF8.GetString($saved)
          $current = 'return fmt.Errorf("Build Tools inspection membership changed during termination; completion is unproved; %s", buildToolsQueryMembershipDiagnostic(job, capture, after, len(handles)))'
          $original = 'return errors.New("Build Tools inspection membership changed during termination; completion is unproved")'
          if (($source.Split(@($current), [StringSplitOptions]::None).Count - 1) -ne 1) { throw 'Expected exact diagnostic-only guard source' }
          try {
            [IO.File]::WriteAllText($path, $source.Replace($current, $original), [Text.UTF8Encoding]::new($false))
            $output = & go test -v -count=1 -timeout 2m -run '^TestWindowsBuildToolsQueryRejectsChangedMembership$' . 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($code -eq 0 -or ($output -join "`n") -notmatch 'late-member refusal lost bounded accounting evidence') { throw 'Original error did not fail the intended diagnostic regression' }
          } finally {
            [IO.File]::WriteAllBytes($path, $saved)
          }
          exit 0
      - name: Prove unsafe wrapper loses actual kernel output
        working-directory: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Get-Location) 'windows_buildtools_query_windows.go'
          $saved = [IO.File]::ReadAllBytes($path)
          $source = [Text.Encoding]::UTF8.GetString($saved)
          $signature = 'func queryBuildToolsJobInformation(job windows.Handle, class int32, data unsafe.Pointer, size uint32) error {'
          $start = $source.IndexOf($signature, [StringComparison]::Ordinal)
          if ($start -lt 0 -or $source.LastIndexOf($signature, [StringComparison]::Ordinal) -ne $start) { throw 'Expected exact typed query helper' }
          $end = $source.IndexOf("`n}", $start, [StringComparison]::Ordinal) + 2
          if ($end -le $start) { throw 'Typed query helper end not found' }
          $current = $source.Substring($start, $end - $start)
          $original = $signature + "`n`treturn windows.QueryInformationJobObject(job, class, uintptr(data), size, nil)`n}"
          try {
            [IO.File]::WriteAllText($path, $source.Replace($current, $original), [Text.UTF8Encoding]::new($false))
            $output = & go test -v -count=1 -timeout 2m -run '^TestWindowsBuildToolsQueryWritesOutputAcrossStackGrowth$' . 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($code -eq 0 -or ($output -join "`n") -notmatch 'kernel output was lost') { throw 'Unsafe wrapper did not reproduce lost kernel output' }
          } finally {
            [IO.File]::WriteAllBytes($path, $saved)
          }
          exit 0
      - name: Prove unsafe limit wrapper loses actual kernel input
        working-directory: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path (Get-Location) 'windows_buildtools_query_windows.go'
          $saved = [IO.File]::ReadAllBytes($path)
          $source = [Text.Encoding]::UTF8.GetString($saved)
          $current = "`tok, _, err := buildToolsSetJobInformation.Call(uintptr(job), uintptr(windows.JobObjectExtendedLimitInformation), uintptr(unsafe.Pointer(&limits)), unsafe.Sizeof(limits))`n`tif ok == 0 {"
          $original = "`t_, err := windows.SetInformationJobObject(job, windows.JobObjectExtendedLimitInformation, uintptr(unsafe.Pointer(&limits)), uint32(unsafe.Sizeof(limits)))`n`tif err != nil {"
          if (($source.Split(@($current), [StringSplitOptions]::None).Count - 1) -ne 1) { throw 'Expected exact fixed limit boundary' }
          try {
            [IO.File]::WriteAllText($path, $source.Replace($current, $original), [Text.UTF8Encoding]::new($false))
            $output = & go test -v -count=1 -timeout 2m -run '^TestWindowsBuildToolsQueryWritesOutputAcrossStackGrowth$/limits$' . 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Output $_ }
            if ($code -eq 0 -or ($output -join "`n") -notmatch 'kernel output was lost') { throw 'Unsafe limit wrapper did not reproduce lost kernel input' }
          } finally {
            [IO.File]::WriteAllBytes($path, $saved)
          }
          exit 0
      - name: Verify exact owned process completion and outside survival
        if: always()
        working-directory: installer
        shell: pwsh
        run: |
          go test -v -count=1 -timeout 3m -run '^TestWindowsBuildToolsQuery' .
          if ($LASTEXITCODE -ne 0) { throw 'Private query lifetime regression failed' }
      - name: Observe a fixed series of real compiler reuse queries
        if: always()
        working-directory: installer
        shell: pwsh
        run: |
          go test -v -count=6 -timeout 8m -run '^TestWindowsBuildToolsNativeReuseAndEnvironment$' .
          if ($LASTEXITCODE -ne 0) { throw 'Real compiler reuse failed; preserve original bounded diagnostic' }
