name: Windows v5 native diagnostics

on:
  push:
    branches: [diagnostics/installer-windows-v5]

permissions:
  contents: read

jobs:
  windows-neovim:
    name: Complete Windows Neovim lifecycle
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: installer
        shell: bash
    env:
      GOTOOLCHAIN: local
      DOTFILES_TEST_NVIM_APPLICATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: installer/go.sum
      - name: Verify actual native runner target
        run: test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = windows/amd64
      - name: Install consume update and remove complete Neovim selection
        run: >-
          go test -v -count=1 -timeout 80m
          -run '^TestNativeNeovimInstalledApplicationLifecycle$' .
