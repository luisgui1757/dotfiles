name: Temporary Ubuntu ARM zsh compaudit diagnostic

on:
  push:
    branches: [diagnostics/zsh-compaudit-044]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: installer/go.sum
      - name: Verify native target and exact frozen helper sources
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/arm64
          uname -m
          printf '%s  %s\n' 60948ab7540979c7d40e9e16a22752c54f951adcb1485f3f02b2b5569c9fa8ea scripts/prepare-disposable-linux-host.sh db618ff1cd7d73c27b9ae48326ceaa8764a2043980f6b8411dc0b510b7ec005f tests/native/linux_host_preparation_test.sh | sha256sum -c -
      - name: Install the same native zsh package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck
          zsh --version
      - name: Observe native completion audit without changing permissions
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/share /usr/share/zsh /usr/share/zsh/vendor-completions; do
            if [[ -e "$path" ]]; then
              namei -l "$path"
              stat -c 'Reviewed boundary: %n type=%F owner=%u group=%g mode=%a' "$path"
            else
              printf 'Reviewed boundary MISSING: %s\n' "$path"
            fi
          done
          zsh -d -f -c 'print -rl -- $fpath' | while IFS= read -r path; do
            if [[ -e "$path" ]]; then
              namei -l "$path"
              stat -c '%n type=%F owner=%u group=%g mode=%a' "$path"
            fi
          done
          set +e
          zsh -d -f -c 'autoload -Uz compaudit; compaudit' > "$RUNNER_TEMP/compaudit.out" 2> "$RUNNER_TEMP/compaudit.err"
          audit_status=$?
          set -e
          printf 'compaudit exit=%s\n' "$audit_status"
          cat "$RUNNER_TEMP/compaudit.out" "$RUNNER_TEMP/compaudit.err"
          while IFS= read -r path; do
            [[ "$path" == /* ]] || exit 1
            namei -l "$path"
            stat -c '%n type=%F owner=%u group=%g mode=%a' "$path"
          done < "$RUNNER_TEMP/compaudit.out"
      - name: Prove unsafe-boundary refusal and exact factored preparation
        shell: bash
        run: |
          set -euo pipefail
          bash tests/native/linux_host_preparation_test.sh
          bash scripts/prepare-disposable-linux-host.sh shell
      - name: Run the unchanged complete shell suite
        shell: bash
        run: |
          set -euo pipefail
          make test-shell
