# The Rose Pine theme that superfile 1.6.0 includes, unchanged except for 9
# colors that are not Rose Pine colors (MIT):
# https://github.com/yorukot/superfile/blob/v1.6.0/src/superfile_config/theme/rose-pine.toml
# A comment marks each changed color and gives the old value. Typing errors get
# the color the theme means. The others get the Rose Pine color of their role:
# https://rosepinetheme.com/palette/ and the Rose Pine Neovim theme (border = muted).
# superfile writes its own themes into this folder, so this file has its own name.

##############################################
#                                            #
#               Rose Pine Theme              #
#                                            #
##############################################

# This theme was created by: https://github.com/pearcidar ! Thank you <3

# This contains the theme config file for superfile! For more details see:
# https://superfile.dev/configure/custom-theme/

###############################################################################
#                           Code Syntax Highlighting                          #
###############################################################################

# Find one you like at: https://github.com/alecthomas/chroma/blob/master/styles.

code_syntax_highlight = "rose-pine"

###############################################################################
#                                 Base Colors                                 #
###############################################################################

#-- Full Screen
full_screen_fg = "#e0def4"
full_screen_bg = "#191724"

#-- Gradient
# Note: This currently only supports two colors.
gradient_color = ["#31748f", "#eb6f92"] # was #31784f, a typing error for pine

#-- File Panel
file_panel_fg = "#e0def4"
file_panel_bg = "#191724"
file_panel_border = "#403d52"
file_panel_border_active = "#6e6a86" # was #6e6e86, a typing error for muted
file_panel_top_directory_icon = "#9ccfd8"
file_panel_top_path = "#ebbcba"
file_panel_item_selected_fg = "#c4a7e7"
file_panel_item_selected_bg = "#191724"

#-- Footer
footer_fg = "#e0def4"
footer_bg = "#191724"
footer_border = "#403d52"
footer_border_active = "#f6c177"

#-- Sidebar
sidebar_fg = "#e0def4"
sidebar_bg = "#191724"
sidebar_title = "#6e6a86" # was #6e6e86, a typing error for muted
sidebar_border = "#191724"
sidebar_border_active = "#c4a7e7"
sidebar_item_selected_fg = "#f6c177"
sidebar_item_selected_bg = "#191724"
sidebar_divider = "#6e6a86" # was #868686: muted, the Rose Pine border color

#-- Modals
modal_fg = "#e0def4"
modal_bg = "#191724"
modal_border_active = "#6e6a86" # was #868686: muted, the Rose Pine border color
modal_cancel_fg = "#e0def4"
modal_cancel_bg = "#524f67"
modal_confirm_fg = "#e0def4"
modal_confirm_bg = "#eb6f92"

#-- Help Menu
help_menu_hotkey = "#f6c177"
help_menu_title = "#9ccfd8"

#-- Special
cursor = "#9ccfd8"
correct = "#31748f" # was #8ec07c: pine, for affirmative signals
error = "#eb6f92" # was #ff6969: love, for errors
hint = "#31748f" # was #31784f, a typing error for pine
cancel = "#6e6a86" # was #838383: muted, for dimmed labels
